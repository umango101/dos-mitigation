# Setup
- import_playbook: "setup.yml"

- hosts: server, router, active_clients, active_attackers, auth0, auth1, auth2, auth3
  tasks:
    - name: create local log directories
      file:
        path: "{{ user_dir }}/logs/{{ session }}/{{ timestamp }}/{{ inventory_hostname }}"
        state: directory
      delegate_to: localhost
- hosts: localhost
  tasks:
    - name: copy settings
      copy:
        src: "{{ user_dir }}/.settings"
        dest: "{{ user_dir }}/logs/{{ session }}/{{ timestamp }}/.settings"

# Unmitigated Baseline
- import_playbook: "clear_logs.yml"
- import_playbook: "mitigations/{{ mitigation }}_disable.yml"

- hosts: active_clients
  gather_facts: no
  tasks:
  - name: fail if client_app is not defined
    fail:
      msg: "client_app is not defined"
    when: client_app is not defined
  - name: start {{ client_app }} clients
    shell: timeout {{ client_duration }} {{ user_dir }}/common/clients/{{ client_app }}.sh {{ server_name }} {{ client_interval }} {{ file_size }} {{ 0 }}
    async: "{{ client_duration }}"
    poll: 0
    register: client_async
    become: "{{ client_app == 'dns_client' }}"
  - name: wait for clients
    pause:
      seconds: "{{ client_duration }}"
  - name: check on clients
    async_status:
      jid: "{{ client_async.ansible_job_id }}"
    register: result
    until: result.finished
    failed_when: result.rc not in [0, 124]
    become: "{{ client_app == 'dns_client' }}"
  - name: async cleanup
    async_status:
      jid: "{{ client_async.ansible_job_id }}"
      mode: cleanup
    become: "{{ client_app == 'dns_client' }}"

- hosts: server
  gather_facts: no
  tasks:
  - name: restart nginx
    systemd:
      name: nginx
      state: restarted
      daemon_reload: yes
    become: yes

- hosts: server, router, active_clients, active_attackers, auth0, auth1, auth2, auth3
  gather_facts: no
  tasks:
  - name: wait for logging to finish
    pause:
      seconds: "{{ cleanup_delay }}"
  - name: compress logs
    archive:
      path: /tmp/logs
      dest: /tmp/logs.zip
      format: zip
    ignore_errors: yes
  - name: collect logs
    fetch:
      src: /tmp/logs.zip
      dest: "{{ user_dir }}/logs/{{ session }}/{{ timestamp }}/{{ inventory_hostname }}/UB/logs.zip"
      flat: yes
    ignore_errors: yes

# Unmitigated Attack
- import_playbook: "clear_logs.yml"
- hosts: a0
  gather_facts: no
  tasks:
  - name: launch {{ attack_type }} attack
    shell: timeout {{ attack_duration }} cpulimit -l {{ attacker_cpu_limit }} -f -- {{ user_dir }}/common/attacks/{{ attack_type }} {{ attacker_busywait }}
    async: "{{ attack_duration }}"
    poll: 0
    become: yes
    register: attacker_async

- hosts: active_clients
  gather_facts: no
  tasks:
  - name: start {{ client_app }} clients
    shell: timeout {{ client_duration }} {{ user_dir }}/common/clients/{{ client_app }}.sh {{ server_name }} {{ client_interval }} {{ file_size }} {{ 0 }}
    async: "{{ client_duration }}"
    poll: 0
