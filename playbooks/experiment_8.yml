    become: "{{ client_app == 'dns_client' }}"
  - name: wait for clients
    pause:
      seconds: "{{ client_duration }}"
  - name: check on clients
    async_status:
      jid: "{{ client_async.ansible_job_id }}"
    register: result
    until: result.finished
    become: "{{ client_app == 'dns_client' }}"
    failed_when: result.rc not in [0, 124]
  - name: async cleanup
    become: "{{ client_app == 'dns_client' }}"
    async_status:
      jid: "{{ client_async.ansible_job_id }}"
      mode: cleanup

- hosts: active_attackers
  tasks:
  - name: check on attackers
    async_status:
      jid: "{{ attacker_async.ansible_job_id }}"
    register: result
    until: result.finished
    failed_when: result.rc not in [0, 124]
    become: yes
  - name: async cleanup
    async_status:
      jid: "{{ attacker_async.ansible_job_id }}"
      mode: cleanup
    become: yes
  - name: wait for attack traffic to flush out
    pause:
      seconds: "{{ post_attack_delay }}"

- hosts: server
  gather_facts: no
  tasks:
  - name: restart nginx
    systemd:
      name: nginx
      state: restarted
      daemon_reload: yes
    become: yes

- hosts: server, router, active_clients, active_attackers, auth0, auth1, auth2, auth3
  gather_facts: no
  tasks:
  - name: wait for logging to finish
    pause:
      seconds: "{{ cleanup_delay }}"
  - name: compress logs
    archive:
      path: /tmp/logs
